<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,follow">
    <meta name="theme-color" content="#182742">
    <title>Страница не найдена — ЭнергоГрупп</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: dark; font-family: Arial, sans-serif; }
        * { box-sizing: border-box; }
        body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; color: #f5f3ee; background: #182742; }
        main { width: min(760px, 100%); }
        p { margin: 0; color: rgba(245, 243, 238, .72); font-size: clamp(16px, 2vw, 20px); line-height: 1.55; }
        strong { display: block; margin-bottom: 20px; color: #f08a18; font-size: clamp(88px, 22vw, 190px); font-weight: 300; line-height: .8; }
        h1 { max-width: 12ch; margin: 0 0 28px; font-size: clamp(42px, 8vw, 82px); font-weight: 300; line-height: .95; text-transform: uppercase; }
        a { display: inline-flex; min-height: 48px; margin-top: 42px; padding: 0 28px; align-items: center; border: 1px solid rgba(245, 243, 238, .55); border-radius: 999px; color: inherit; font-size: 12px; letter-spacing: .12em; text-decoration: none; text-transform: uppercase; }
        a:hover, a:focus-visible { border-color: #f08a18; color: #f08a18; }
    </style>
</head>
<body>
    <main>
        <strong>404</strong>
        <h1>Страница не найдена</h1>
        <p>Возможно, адрес изменился или был указан неверно. Вернитесь на главную страницу сайта.</p>
        <a href="./">На главную</a>
    </main>
</body>
</html>
